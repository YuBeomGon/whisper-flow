# Training configuration for LibriSpeech 100h flow decoder
seed: 1337
precision: 16-mixed
accelerator: gpu
devices: 1
strategy: ddp_find_unused_parameters_true
max_epochs: 80
val_check_interval: 1.0
gradient_clip_val: 1.0

data_config: configs/data/libri100.yaml
model_configs:
  encoder: configs/model/whisper_encoder.yaml
  decoder: configs/model/flow_decoder.yaml

loss:
  use_mse: true
  use_ce: true
  ce_weight: 0.9

optimizer:
  name: adamw
  lr: 3.0e-4
  betas: [0.9, 0.98]
  eps: 1.0e-8
  weight_decay: 0.01

scheduler:
  name: cosine
  warmup_steps: 2000
  min_lr: 1.0e-5

logging:
  mlflow:
    experiment: flow-whisper-lib100
    tracking_uri: ./mlruns
  log_every_n_steps: 50

checkpoints:
  dirpath: checkpoints/libri100
  save_top_k: 3
  monitor: val/loss
  mode: min

evaluation:
  metrics: [wer, cer]
  dataset_split: val

notes: |
  Start with batch size 8 per GPU. Increase once stability verified.
