# Training configuration for LibriSpeech 100h flow decoder
seed: 1337
precision: 16-mixed
accelerator: gpu
devices: 6
strategy: ddp_find_unused_parameters_true # ddp_find_unused_parameters_true, deepspeed_stage_2 
max_epochs: 20
val_check_interval: 1.0
gradient_clip_val: 1.0

data_config: configs/data/libri100.yaml
model_configs:
  encoder: configs/model/whisper_encoder.yaml
  decoder: configs/model/flow_decoder.yaml

loss:
  mask_to_gt: true
  inverse_t_weight: true

masking:
  ratio_range: [0.05, 1.0]
  min_masks: 1
  schedule:
    - start_epoch: 0
      ratio_range: [0.05, 1.0]
    - start_epoch: 2
      ratio_range: [0.3, 1.0]
    - start_epoch: 4
      ratio_range: [0.7, 1.0]

stepwise:
  enabled: false
  hi_ratio: [0.4, 0.95]
  lo_factor: [0.5, 0.9]
  loss_weight: 0.1

optimizer:
  name: adamw
  lr: 3.0e-4
  betas: [0.9, 0.98]
  eps: 1.0e-8
  weight_decay: 0.01

scheduler:
  name: cosine
  warmup_steps: 2000
  min_lr: 1.0e-5

logging:
  mlflow:
    experiment: flow-whisper-lib100
    tracking_uri: ./mlruns
  log_every_n_steps: 50

checkpoints:
  dirpath: checkpoints/libri100
  save_top_k: 3
  monitor: val/loss
  mode: min

evaluation:
  metrics: [wer, cer]
  dataset_split: val

notes: |
  Start with batch size 8 per GPU. Increase once stability verified.
