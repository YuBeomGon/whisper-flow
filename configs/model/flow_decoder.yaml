# Flow decoder configuration (Whisper-based)
type: flow_whisper
hidden_size: 768
num_layers: 12
num_heads: 12
dropout: 0.1
max_text_tokens: 448
causal_mask: false
tie_embeddings: true
init_from_whisper: true

time_embedding:
  type: fourier
  dim: 256

flow:
  path: linear
  sigma: 1.0
  noise_schedule: constant
  sampler:
    method: euler
    steps: 16
    clip: null

notes: |
  Decoder weights initialized from Whisper decoder; causal mask removed for full-context self-attention.
