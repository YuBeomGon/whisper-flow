# Default inference configuration
checkpoint: checkpoints/libri100/flow-whisper-epoch=12.ckpt
train_config: configs/train/libri100.yaml
audio_sample_rate: 16000
max_text_tokens: 448

sampler:
  mask_schedule: [1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1, 0.0]
  mode: greedy  # or "sample"
  top_k_temperature:
    enabled: true
    high_mask_threshold: 0.7
    mid_mask_threshold: 0.3
    high_mask_temperature: 1.3
    mid_mask_temperature: 1.1
    low_mask_temperature: 1.0
    high_mask_top_k: 32
    mid_mask_top_k: 16
    low_mask_top_k: 0
  refine:
    enabled: true
    tokens: 8
    entropy_threshold: 1.5

# decoding:
#   strategy: greedy
#   return_timestamps: false
#   strip_after_eot: true

prefix:
  language: en
  task: transcribe

output:
  save_transcript: outputs/transcripts.jsonl
  save_tokens: true

notes: |
  Adjust sampler steps/temperature for quality-latency trade-offs. Use the same prefix tokens as training.
