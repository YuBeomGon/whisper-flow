# Default inference configuration
checkpoint: checkpoints/libri100/flow-whisper-epoch=00.ckpt
train_config: configs/train/libri100.yaml
audio_sample_rate: 16000
max_text_tokens: 448

sampler:
  mask_schedule: [1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1, 0.0]
  # top_k: 5          # TODO: add support in pipeline for sampling instead of greedy picks
  # temperature: 1.0  # TODO: scale logits before argmax once implementation is added

decoding:
  strategy: greedy
  return_timestamps: true
  strip_after_eot: true

prefix:
  language: en
  task: transcribe

output:
  save_transcript: outputs/transcripts.jsonl
  save_tokens: true

notes: |
  Adjust sampler steps/temperature for quality-latency trade-offs. Use the same prefix tokens as training.
